# Packshot Studio: docker compose up -d --build   ->  http://localhost:8080
# Settings (sharing with colleagues, logins) go in .env, see .env.example
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    # Blender (bpy) only exists for Linux on Intel/AMD (x86_64). On a Mac with an Apple chip
    # Docker Desktop runs this through Rosetta automatically.
    platform: linux/amd64
    build: { context: ., dockerfile: backend/Dockerfile }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - packshot-data:/data
    depends_on: [redis]
    restart: unless-stopped

  worker:
    # Renders run here (Blender Cycles, CPU). Scale with: docker compose up --scale worker=2
    platform: linux/amd64
    build: { context: ., dockerfile: backend/Dockerfile }
    command: rq worker renders --url redis://redis:6379/0
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - packshot-data:/data
    depends_on: [redis]
    restart: unless-stopped

  web:
    build: { context: frontend }
    ports:
      # 127.0.0.1 = only this computer. Set PACKSHOT_BIND=0.0.0.0 in .env to share on the network.
      - "${PACKSHOT_BIND:-127.0.0.1}:${PACKSHOT_PORT:-8080}:80"
    environment:
      PACKSHOT_USERS: ${PACKSHOT_USERS:-}
      PACKSHOT_BIND: ${PACKSHOT_BIND:-127.0.0.1}
    depends_on: [api]
    restart: unless-stopped

volumes:
  packshot-data:
